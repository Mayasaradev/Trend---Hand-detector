plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.handdistort'
    compileSdk 33
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.example.handdistort"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fopenmp"
                arguments "-DANDROID_STL=c++_shared", "-DTFLITE_DIR=${buildDir}/tflite"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

afterEvaluate {
    task extractTFLite(type: Copy) {
        dependsOn configurations.debugRuntimeClasspath
        def tfliteAar = configurations.debugRuntimeClasspath.files.find { 
            it.name.startsWith('tensorflow-lite-') && it.name.endsWith('.aar') 
        }
        if (tfliteAar == null) {
            throw new GradleException("TensorFlow Lite AAR not found")
        }
        from zipTree(tfliteAar)
        include 'headers/**'
        include 'jni/**'
        into "$buildDir/tflite"
    }
    preBuild.dependsOn extractTFLite
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.13.0'
}
